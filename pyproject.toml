[project]
name = "tryit-rsi"
version = "0.1.0"
description = "Recursive self-improvement of LLM agent harnesses, with fixed safety instrumentation"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.9", "pyyaml>=6"]

[project.optional-dependencies]
litellm = ["litellm"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
